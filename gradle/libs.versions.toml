# Catálogo de versiones.
#
# Todo lo que hay que tocar cuando algo no resuelve está aquí, en un solo sitio.
# Nada de esto se ha comprobado contra un repositorio real: si Gradle se queja de
# una dependencia, es aquí donde se sube el número, no en los build.gradle.kts.
#
# Restricciones que atan unas versiones a otras:
#   - `kotlin-compose` DEBE ir a la misma versión que `kotlin`: desde Kotlin 2.0
#     el compilador de Compose vive en el repositorio de Kotlin y se aplica como
#     plugin, no como `composeOptions.kotlinCompilerExtensionVersion`.
#   - `ksp` lleva la versión de Kotlin como prefijo. Al subir Kotlin hay que
#     subir KSP a la pareja correspondiente o falla al arrancar.
#   - `agp` 8.7 exige Gradle 8.9 o superior (ver gradle-wrapper.properties).

[versions]
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.25"

compileSdk = "35"
minSdk = "26"
targetSdk = "35"

composeBom = "2024.12.01"
coreKtx = "1.15.0"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
navigationCompose = "2.8.5"
room = "2.6.1"
work = "2.10.0"
datastore = "1.1.1"

okhttp = "4.12.0"
retrofit = "2.11.0"
serializationJson = "1.7.3"

appauth = "0.11.1"
browser = "1.8.0"
mlkitDigitalInk = "18.1.0"
mlkitTextRecognition = "16.0.1"
# PDF vectorial de las notas (lectura de paths y escritura), sin AWT.
pdfbox = "2.0.27.0"

# Verificado contra el maven-metadata.xml del repositorio de Boox el 2026-09-04:
# onyxsdk-pen publica hasta 1.5.4.3 y no existe ninguna 1.4.11.1.
# El listado de directorios del repositorio está desactivado; para consultarlo:
#   https://repo.boox.com/repository/maven-public/com/onyx/android/sdk/onyxsdk-pen/maven-metadata.xml
#
# onyxsdk-device se fija a la versión que onyxsdk-pen 1.5.4.3 arrastra por su
# cuenta. Declarar una distinta solo sirve para que Gradle resuelva un conflicto
# que no hacía falta crear.
onyxPen = "1.5.4.3"
onyxDevice = "1.3.5.2"
# El SDK de Onyx usa APIs ocultas del sistema; en Android 9+ hay que eximirlas
# o el trazo rápido se monta y no entrega nada. Es lo que hace el demo oficial.
hiddenApiBypass = "4.3"

junit = "4.13.2"
coroutinesTest = "1.9.0"
androidxJunit = "1.2.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }

appauth = { module = "net.openid:appauth", version.ref = "appauth" }
mlkit-digital-ink = { module = "com.google.mlkit:digital-ink-recognition", version.ref = "mlkitDigitalInk" }
mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "mlkitTextRecognition" }
pdfbox-android = { module = "com.tom-roush:pdfbox-android", version.ref = "pdfbox" }

onyx-pen = { module = "com.onyx.android.sdk:onyxsdk-pen", version.ref = "onyxPen" }
onyx-device = { module = "com.onyx.android.sdk:onyxsdk-device", version.ref = "onyxDevice" }
hidden-api-bypass = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version.ref = "hiddenApiBypass" }

junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
