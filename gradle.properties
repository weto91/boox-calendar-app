org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# La caché de configuración se deja apagada a propósito hasta que el proyecto
# compile de verdad: cuando falla, el error que da tapa al error real.

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Room 2.6 no está preparado para KSP2. Si al subir Room a 2.7+ se quiere KSP2,
# quita esta línea; si al subir Kotlin aparecen errores raros en el procesador
# de Room, es lo primero que hay que mirar.
ksp.useKSP2=false
